# Local hot-reload overlay (auto-merged by Docker Compose when present).
# Frontend runs Vite with the source mounted — edit files and the browser updates.
# For a production nginx build only: docker compose -f docker-compose.yml up --build

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_HMR_CLIENT_PORT: "80"
      VITE_API_PROXY: http://backend:8080
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=5173
    networks:
      - sunny
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
